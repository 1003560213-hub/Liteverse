name: Publish release

# Builds, verifies, and publishes one tagged developer preview. Push a tag such
# as v0.6.0 (with docs/releases/v0.6.0.md present) or run manually with a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.6.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Resolve version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag $RELEASE_TAG" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          test -f "source/docs/releases/${RELEASE_TAG}.md"
          test "$(node -p "require('./source/package.json').version")" = "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        working-directory: source
        run: |
          python -m pip install --requirement requirements.txt
          npm ci

      - name: Verify tagged source
        working-directory: source
        run: |
          npm run verify:public
          npm run lint
          npm run desktop:package
          npm test

      - name: Assemble release assets
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          bundle_dir="$release_dir/Liteverse-${RELEASE_VERSION}-macos-arm64"
          app="$bundle_dir/Liteverse.app"
          mkdir -p "$bundle_dir"

          ditto "$GITHUB_WORKSPACE/source/Liteverse.app" "$app"
          cp "$GITHUB_WORKSPACE/source/LICENSE" "$bundle_dir/LICENSE"
          cp "$GITHUB_WORKSPACE/source/ASSET_LICENSES.md" "$bundle_dir/ASSET_LICENSES.md"
          cp "$GITHUB_WORKSPACE/source/docs/releases/macos-install.txt" "$bundle_dir/README.txt"

          ditto -c -k --sequesterRsrc --keepParent "$bundle_dir" \
            "$release_dir/Liteverse-${RELEASE_VERSION}-macos-arm64.zip"
          git -C "$GITHUB_WORKSPACE/source" archive --format=zip \
            --prefix="Liteverse-${RELEASE_VERSION}/" \
            --output="$release_dir/Liteverse-${RELEASE_VERSION}-source.zip" "$RELEASE_TAG"

          cd "$release_dir"
          shasum -a 256 "Liteverse-${RELEASE_VERSION}-macos-arm64.zip" \
            "Liteverse-${RELEASE_VERSION}-source.zip" > SHA256SUMS

          commit="$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$RELEASE_TAG^{commit}")"
          app_version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
          app_build="$(defaults read "$app/Contents/Info" CFBundleVersion)"
          test "$app_version" = "$RELEASE_VERSION"
          for binary in Liteverse LiteverseLocalWorker; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64
          done
          intelligence="not included (built without the macOS 26 SDK)"
          if [[ -x "$app/Contents/MacOS/LiteverseIntelligence" ]]; then
            lipo "$app/Contents/MacOS/LiteverseIntelligence" -verify_arch arm64
            intelligence="$(file -b "$app/Contents/MacOS/LiteverseIntelligence")"
          fi
          node -e 'const fs = require("fs"); const seed = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const key of ["categories", "papers", "relations"]) { if (!Array.isArray(seed[key]) || seed[key].length !== 0) throw new Error(`non-empty public seed: ${key}`); }' \
            "$app/Contents/Resources/seed-universe.json"
          test -z "$(find "$app/Contents/Resources/seed-papers" -type f -print -quit)"
          {
            printf 'Liteverse %s — Developer Preview\n' "$RELEASE_VERSION"
            printf 'Tag: %s\nCommit: %s\n' "$RELEASE_TAG" "$commit"
            printf 'App version: %s (build %s)\n' "$app_version" "$app_build"
            printf 'Runner: macos-26, %s\n' "$(xcodebuild -version | head -1)"
            printf 'Signing: ad-hoc; not notarized\n'
            printf 'Main executable: %s\n' "$(file -b "$app/Contents/MacOS/Liteverse")"
            printf 'Local Worker: %s\n' "$(file -b "$app/Contents/MacOS/LiteverseLocalWorker")"
            printf 'Apple Intelligence helper: %s\n' "$intelligence"
            printf 'Public seed: 0 regions, 0 papers, 0 relations\n'
            printf 'Checks: privacy, English source, lint, package, full test suite, code signatures\n'
          } > RELEASE-MANIFEST.txt

          shasum -a 256 -c SHA256SUMS
          unzip -tq "Liteverse-${RELEASE_VERSION}-macos-arm64.zip"
          unzip -tq "Liteverse-${RELEASE_VERSION}-source.zip"
          codesign --verify --deep --strict "$app"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          notes="$GITHUB_WORKSPACE/source/docs/releases/${RELEASE_TAG}.md"
          title="Liteverse ${RELEASE_VERSION} — Developer Preview"
          assets=(
            "$release_dir/Liteverse-${RELEASE_VERSION}-macos-arm64.zip"
            "$release_dir/Liteverse-${RELEASE_VERSION}-source.zip"
            "$release_dir/SHA256SUMS"
            "$release_dir/RELEASE-MANIFEST.txt"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$title" \
              --notes-file "$notes" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
